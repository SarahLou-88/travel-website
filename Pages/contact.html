<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 w-full py-2 bg-blue-950 shadow">
    <div class="w-full container mx-auto flex flex-wrap items-center justify-between">
      <ul class="flex items-center font-bold text-sm text-white uppercase no-underline">
        <li><a class="hover:text-gray-200 hover:underline px-2" href="../index.html">Home</a></li>
      </ul>
      <ul class="flex items-center font-bold text-sm text-white uppercase no-underline">
        <li><a class="hover:text-gray-200 hover:underline px-2" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contact Form -->
  <section class="max-w-2xl mx-auto p-8 mt-12 bg-white shadow-lg rounded-lg">
    <h2 class="text-3xl font-bold mb-6 text-center">Contact Us</h2>
    <form action="#" method="POST" class="space-y-6">
      <div>
        <label for="name" class="block font-semibold mb-1">Name</label>
        <input type="text" id="name" name="name" required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="email" class="block font-semibold mb-1">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="message" class="block font-semibold mb-1">Message</label>
        <textarea id="message" name="message" rows="5" required
                  class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="text-center">
        <button type="submit"
                class="px-6 py-2 bg-blue-700 text-white font-bold rounded hover:bg-blue-800 transition">
          Send Message
        </button>
      </div>
    </form>
    <!-- Footer -->
<footer class="bg-blue-950 text-white pt-10 pb-6 mt-24">
    <div class="max-w-6xl mx-auto px-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 text-center md:text-left">
            <!-- Quick Links -->
            <div>
                <h3 class="text-lg font-semibold mb-4 uppercase tracking-widest">Quick Links</h3>
                <ul class="space-y-2 text-sm text-gray-300">
                    <li><a href="index.html" class="hover:underline">Home</a></li>
                    <li><a href="#popular" class="hover:underline">Popular Destinations</a></li>
                    <li><a href="index.html" class="hover:underline">Contact</a></li>
                </ul>
            </div>

            <!-- Socials -->
            <div>
                <h3 class="text-lg font-semibold mb-4 uppercase tracking-widest">Follow Me</h3>
                <div class="flex justify-center md:justify-start gap-4 text-2xl">
                    <a href="#" class="text-pink-500 hover:text-white"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="text-blue-400 hover:text-white"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-blue-600 hover:text-white"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="text-red-600 hover:text-white"><i class="fab fa-youtube"></i></a>
                </div>

                <!-- Travel Tip -->
                <div class="mt-6 text-sm italic text-gray-300">
                    ✈️ Travel Tip: Collect moments, not things.
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-700 my-8"></div>

        <!-- Bottom -->
        <div class="text-center text-sm text-gray-400">
            &copy; 2025 Travel Bug by Sarah. All rights reserved.
        </div>
    </div>
</footer>
  </section>
</body>
</html>
